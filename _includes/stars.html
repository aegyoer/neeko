{% assign star_rating = include.rating | times: 1.0 %}<span class="stars" aria-label="{{ include.rating }} out of 5">{% for star_i in (1..5) %}{% assign star_half = star_i | minus: 0.5 %}{% if star_rating >= star_i %}<span class="s full">★</span>{% elsif star_rating >= star_half %}<span class="s half">★</span>{% else %}<span class="s empty">★</span>{% endif %}{% endfor %}</span>
