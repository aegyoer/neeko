{% assign it = include.item %}{% assign t = site.media_types | where: "id", it.type | first %}{% if it.cover %}<img src="{{ it.cover | relative_url }}" alt="Cover of {{ it.title }}" loading="lazy">{% else %}<span class="tile tile-{{ it.type }}" aria-hidden="true"><span class="tile-emoji">{{ t.emoji | default: "✿" }}</span><span class="tile-title">{{ it.title }}</span></span>{% endif %}
