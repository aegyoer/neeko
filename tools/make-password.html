<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make a password code</title>
<style>
  :root { --bg:#fff7f2; --card:#fff; --ink:#3d2f4f; --soft:#85779a; --line:#f0e2da; --accent:#ff7aa8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1826; --card:#282133; --ink:#f3ebff; --soft:#ab9fc0; --line:#3a3147; --accent:#ff8db6; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; box-sizing:border-box;
         background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, sans-serif; }
  .card { max-width:460px; width:100%; background:var(--card); border:1.5px solid var(--line); border-radius:26px; padding:30px; }
  h1 { margin:0 0 6px; font-size:1.5rem; }
  p { color:var(--soft); margin:0 0 16px; }
  input, textarea { width:100%; box-sizing:border-box; font:inherit; color:var(--ink); background:var(--bg);
         border:2px solid var(--line); border-radius:14px; padding:10px 14px; }
  textarea { font-family:ui-monospace, monospace; font-size:.8rem; height:70px; resize:none; margin-top:14px; }
  button { margin-top:10px; width:100%; padding:10px; border:0; border-radius:999px; background:var(--accent); color:#fff; font:600 1rem system-ui; cursor:pointer; }
  code { background:var(--bg); padding:1px 6px; border-radius:6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 Make a password code</h1>
    <p>Type the password you want for your site. Then copy the code into <code>_config.yml</code> as <code>password_hash</code>. Nothing you type leaves this page.</p>
    <input id="pw" type="text" placeholder="your new password" autocomplete="off">
    <textarea id="out" readonly placeholder="your code will appear here"></textarea>
    <button id="copy" type="button">Copy code</button>
  </div>
<script>
  var pw = document.getElementById('pw'), out = document.getElementById('out');
  pw.addEventListener('input', async function () {
    if (!pw.value) { out.value = ''; return; }
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw.value));
    out.value = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
  document.getElementById('copy').addEventListener('click', function () {
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch (e) { document.execCommand('copy'); }
    this.textContent = 'Copied ♡';
  });
</script>
</body>
</html>
